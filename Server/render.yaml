# Render Blueprint — https://render.com
# Dashboard → New → Blueprint → connect this repo → root: Server/render.yaml
services:
  - type: web
    name: taskflow-api
    runtime: node
    rootDir: Server
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
